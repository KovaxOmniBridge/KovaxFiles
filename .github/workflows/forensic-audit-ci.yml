name: Forensic Redaction Security Audit & CI Artifacts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-audit:
    name: Forensic Audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Forensic Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pypdf pdfminer.six pillow

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Build Application Assets
        run: npm run build

      - name: Run Distribution Prerequisites Verification
        run: npm run test:distribution-prerequisites

      # No Linux, xvfb gerencia o display virtual para Electron/Chromium headless
      - name: Run Dynamic Runtime Sandbox Isolation Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -- npm run test:sandbox-isolation

      # No Windows e macOS, a execução dinâmica utiliza a sessão de usuário nativa
      - name: Run Dynamic Runtime Sandbox Isolation Test (Windows & macOS)
        if: runner.os != 'Linux'
        run: npm run test:sandbox-isolation

      - name: Run Distribution Security Architecture Tests
        run: npm run test:dist-security

      - name: Run Forensic Redaction Security Battery (Synthetic + Realistic Legal Corpus)
        run: npm run test:security-redaction

      - name: Run Path Security Session Integration Tests
        run: npm run test:path-integration

      - name: Run PDF Edge Cases Diagnostics
        run: npm run test:pdf-edge-cases

      - name: Run Raster Quality Criteria & Effective Resolution Tests
        run: npm run test:raster-quality

      - name: Publish Forensic Report to GitHub Step Summary
        if: always()
        shell: bash
        run: |
          if [ -f test_output/battery/relatorio_forense_resumo.md ]; then
            cat test_output/battery/relatorio_forense_resumo.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Archive Forensic Reports & Audit Evidence (90-Day Retention)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forensic-audit-evidence-${{ matrix.os }}
          path: |
            test_output/battery/relatorio_forense_anonimizacao.json
            test_output/battery/relatorio_forense_resumo.md
            test_output/battery/*.pdf
            test_output/realistic_corpus/*.pdf
            test_output/*.pdf
          retention-days: 90
