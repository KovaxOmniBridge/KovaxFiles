name: Build & Release Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist & Electron Assets
        run: npm run build

      - name: Build Desktop Executables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            if [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then
              echo "==> Compilando instalador Windows com assinatura digital obrigatória..."
              npm run package:release
            else
              echo "::warning title=Assinatura Digital::Segredo WIN_CSC_LINK não detectado. Para distribuição institucional a órgãos públicos e tribunais, configure o certificado em WIN_CSC_LINK."
              npm run package:win
            fi
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run package:mac
          else
            npm run package:linux
          fi
        shell: bash

      - name: Generate SHA-256 Integrity Manifest
        run: |
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          else
            shasum -a 256 * > SHA256SUMS.txt 2>/dev/null || true
          fi
          echo "Manifesto SHA-256 gerado:"
          cat SHA256SUMS.txt
        shell: bash

      - name: Upload Binaries and Checksums to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.zip
            release/SHA256SUMS.txt
            release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
