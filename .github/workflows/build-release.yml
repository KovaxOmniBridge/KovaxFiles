name: Build & Release Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      allow_unsigned_dev:
        description: 'Permitir compilação de desenvolvimento não assinada (APENAS para testes internos; NUNCA publicado como release oficial)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ============================================================================
  # ETAPA 1: Pré-Voo e Portão de Qualidade Obrigatório (CI Gate)
  # ============================================================================
  preflight_ci:
    name: 🛡️ Portão de CI & Auditoria Pré-Release Obrigatório
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências Limpas
        run: npm ci

      - name: Compilar Frontend Web e Processo Principal
        run: npm run build

      - name: Executar Bateria Completa de Pull Request (11 Suítes)
        run: npm run test:pr

      - name: Executar Testes de Carga, Desempenho e Memória (Suíte 13)
        run: npm run test:load

      - name: Coletar Evidências de Benchmark Reprodutível de Desempenho
        run: npm run benchmark

      - name: Executar Teste de Pacote Desktop Empacotado
        run: npm run test:release

      - name: Executar Auditoria Estrita de Estabilização de Release
        run: npx tsx scripts/verify_release_distribution_package.ts

  # ============================================================================
  # ETAPA 2: Compilação Multiplataforma dos Instaladores Desktop
  # ============================================================================
  build_installers:
    name: 📦 Compilar Instalador (${{ matrix.os }})
    needs: [preflight_ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist & Electron Assets
        run: npm run build

      - name: Build Desktop Executables com Assinatura Obrigatória
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IS_OFFICIAL_RELEASE="${{ startsWith(github.ref, 'refs/tags/') }}"
          ALLOW_UNSIGNED="${{ inputs.allow_unsigned_dev }}"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            if [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then
              echo "==> Compilando instalador Windows com assinatura digital obrigatória (forceCodeSigning=true)..."
              npm run package:release:win
            else
              if [ "$IS_OFFICIAL_RELEASE" = "true" ] || [ "$ALLOW_UNSIGNED" != "true" ]; then
                echo "::error title=Bloqueio de Segurança Crítico::Distribuição institucional abortada. O canal oficial de release exige assinatura digital obrigatória no Windows (WIN_CSC_LINK). É estritamente proibido publicar instaladores não assinados para órgãos públicos, tribunais e advocacia."
                exit 1
              fi
              echo "::warning title=Build de Desenvolvimento::Gerando binário de teste não assinado (NÃO HOMOLOGADO PARA DISTRIBUIÇÃO INSTITUCIONAL)."
              npm run package:dev:win
            fi
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            if [ -n "${{ secrets.MAC_CSC_LINK }}" ] || [ -n "${{ secrets.CSC_LINK }}" ]; then
              echo "==> Compilando pacote macOS com assinatura Apple Developer ID obrigatória..."
              npm run package:release:mac
            else
              if [ "$IS_OFFICIAL_RELEASE" = "true" ] || [ "$ALLOW_UNSIGNED" != "true" ]; then
                echo "::error title=Bloqueio de Segurança Crítico::Distribuição institucional abortada. O canal oficial de release para macOS exige certificado Apple Developer ID (CSC_LINK / MAC_CSC_LINK)."
                exit 1
              fi
              echo "::warning title=Build de Desenvolvimento::Gerando binário macOS não assinado para testes internos."
              npm run package:mac
            fi
          else
            npm run package:linux
          fi
        shell: bash

      - name: Validar e Gerar Manifesto Local da Plataforma
        run: npx tsx scripts/generate_release_manifest.ts --dir=release
        shell: bash

      - name: Upload de Artefatos Temporários
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.zip
            release/latest*.yml
          retention-days: 1
          if-no-files-found: error

  # ============================================================================
  # ETAPA 3: Consolidação do Manifesto SHA-256 e Publicação Oficial
  # ============================================================================
  publish_release:
    name: 🚀 Homologação do Manifesto e Publicação
    needs: [build_installers]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && (inputs.allow_unsigned_dev != true)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Criar Diretório de Consolidação
        run: mkdir -p release

      - name: Baixar Todos os Instaladores Compilados
        uses: actions/download-artifact@v4
        with:
          path: release-downloads

      - name: Mover Artefatos para Diretório de Release
        run: |
          find release-downloads -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" -o -name "latest*.yml" \) -exec cp {} release/ \;
          echo "Conteúdo consolidado de release:"
          ls -la release/

      - name: Gerar Manifesto Consolidado SHA256SUMS.txt (Estrito para Win, Mac e Linux)
        run: npx tsx scripts/generate_release_manifest.ts --dir=release --require=win,mac,linux

      - name: Publicar Release Oficial no GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.zip
            release/SHA256SUMS.txt
            release/latest*.yml
