name: Build & Release Desktop Installers
'on':
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      allow_unsigned_dev:
        description: Permitir compilação de desenvolvimento não assinada (APENAS para testes internos; NUNCA publicado como release oficial)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  preflight_ci:
    name: 🛡️ Portão de CI & Auditoria Pré-Release Obrigatório
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar Dependências Limpas
        run: npm ci
      - name: Typecheck tools and regression gates
        run: npm run prepare:tessdata && npm run typecheck:tools && npm run test:distribution
      - name: Compilar Frontend Web e Processo Principal
        run: npm run build
      - name: Executar Bateria Completa de Pull Request (11 Suítes)
        run: npm run test:pr
      - name: Executar Testes de Carga, Desempenho e Memória (Suíte 13)
        run: npm run test:load
      - name: Coletar Evidências de Benchmark Reprodutível de Desempenho
        run: npm run benchmark
      - name: Executar Auditoria Estrita de Estabilização de Release
        run: npx tsx scripts/verify_release_distribution_package.ts
  build_installers:
    name: 📦 Compilar Instalador (${{ matrix.os }})
    needs:
      - preflight_ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck tools and regression gates
        run: npm run prepare:tessdata && npm run typecheck:tools && npm run test:distribution
      - name: Build Web Dist & Electron Assets
        run: npm run build
      - name: Build Desktop Executables com Assinatura Obrigatória
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DISTRIBUTION_CHANNEL: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.allow_unsigned_dev != true) && 'official' || 'internal' }}
          ALLOW_UNSIGNED_INTERNAL: ${{ inputs.allow_unsigned_dev }}
        run: |
          IS_OFFICIAL_RELEASE="${{ startsWith(github.ref, 'refs/tags/') }}"
          ALLOW_UNSIGNED="${{ inputs.allow_unsigned_dev }}"

          if [ "$ALLOW_UNSIGNED" = "true" ] && [ "$IS_OFFICIAL_RELEASE" != "true" ]; then
            unset CSC_LINK WIN_CSC_LINK MAC_CSC_LINK CSC_KEY_PASSWORD WIN_CSC_KEY_PASSWORD MAC_CSC_KEY_PASSWORD
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              echo "::warning title=Build de Desenvolvimento::Gerando binário de teste não assinado (NÃO HOMOLOGADO PARA DISTRIBUIÇÃO INSTITUCIONAL)."
              npm run package:dev:win
            elif [ "${{ matrix.os }}" = "macos-latest" ]; then
              echo "::warning title=Build de Desenvolvimento::Gerando binário macOS não assinado para testes internos."
              npm run package:mac
            else
              npm run package:linux
            fi
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            if [ -n "$WIN_CSC_LINK" ]; then
              echo "==> Compilando instalador Windows com assinatura digital obrigatória (forceCodeSigning=true)..."
              npm run package:release:win
            else
              echo "::error title=Bloqueio de Segurança Crítico::Distribuição institucional abortada. O canal oficial de release exige assinatura digital obrigatória no Windows (WIN_CSC_LINK). É estritamente proibido publicar instaladores não assinados para órgãos públicos, tribunais e advocacia."
              exit 1
            fi
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            if [ -n "$MAC_CSC_LINK" ] || [ -n "$CSC_LINK" ]; then
              echo "==> Compilando pacote macOS com assinatura Apple Developer ID obrigatória..."
              export CSC_LINK="$MAC_CSC_LINK"
              export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
              npm run package:release:mac
            else
              echo "::error title=Bloqueio de Segurança Crítico::Distribuição institucional abortada. O canal oficial de release para macOS exige certificado Apple Developer ID (CSC_LINK / MAC_CSC_LINK)."
              exit 1
            fi
          else
            npm run package:linux
          fi
        shell: bash
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-evidence-${{ matrix.os }}
          path: ${{ env.RELEASE_DIR }}/**
      - name: Smoke do executável empacotado
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then xvfb-run -a npm run test:release; else npm run test:release; fi
        env:
          DISTRIBUTION_CHANNEL: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.allow_unsigned_dev != true) && 'official' || 'internal' }}
          ALLOW_UNSIGNED_INTERNAL: ${{ inputs.allow_unsigned_dev }}
      - name: Jornada documental no aplicativo empacotado
        shell: bash
        run: if [ "${{ runner.os }}" = "Linux" ]; then xvfb-run -a npm run test:journey; else npm run test:journey; fi
        env:
          DISTRIBUTION_CHANNEL: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.allow_unsigned_dev != true) && 'official' || 'internal' }}
          ALLOW_UNSIGNED_INTERNAL: ${{ inputs.allow_unsigned_dev }}
      - name: Jornada negativa no aplicativo empacotado
        shell: bash
        run: if [ "${{ runner.os }}" = "Linux" ]; then xvfb-run -a npm run test:journey:negative; else npm run test:journey:negative; fi
        env:
          DISTRIBUTION_CHANNEL: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.allow_unsigned_dev != true) && 'official' || 'internal' }}
          ALLOW_UNSIGNED_INTERNAL: ${{ inputs.allow_unsigned_dev }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-failure-${{ matrix.os }}
          path: ${{ env.RELEASE_DIR }}/**
      - name: Validar instaladores e assinaturas
        run: npm run test:installers
        env:
          DISTRIBUTION_CHANNEL: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.allow_unsigned_dev != true) && 'official' || 'internal' }}
          ALLOW_UNSIGNED_INTERNAL: ${{ inputs.allow_unsigned_dev }}
      - name: Validar e Gerar Manifesto Local da Plataforma
        run: npm run distribution:finalize
        shell: bash
        env:
          DISTRIBUTION_CHANNEL: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.allow_unsigned_dev != true) && 'official' || 'internal' }}
          ALLOW_UNSIGNED_INTERNAL: ${{ inputs.allow_unsigned_dev }}
      - name: Upload de Artefatos Temporários
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ env.RELEASE_DIR }}/**
          retention-days: 1
          if-no-files-found: error
    env:
      RELEASE_DIR: release/runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
      NODE_OPTIONS: --max-old-space-size=4096
  publish_release:
    permissions:
      contents: write
    name: 🚀 Homologação do Manifesto e Publicação
    needs:
      - build_installers
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && (inputs.allow_unsigned_dev != true)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck tools and regression gates
        run: npm run prepare:tessdata && npm run typecheck:tools && npm run test:distribution
      - name: Criar Diretório de Consolidação
        run: mkdir -p release
      - name: Baixar Todos os Instaladores Compilados
        uses: actions/download-artifact@v4
        with:
          path: release-downloads
      - name: Consolidar e Validar Artefatos Selecionados para Publicação
        run: npx tsx scripts/prepare_release_publication.ts --downloads=release-downloads --output=release --require=win,mac,linux --channel=official --expected-commit=${{ github.sha }} --expected-run-id=${{ github.run_id }}
      - name: Publicar Release Oficial no GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/SHA256SUMS.txt
