name: Continuous Integration & Tiered Quality Gates
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: 0 3 * * *
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  pr-quality-gates:
    name: PR Quality Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck tools and regression gates
        run: npm run prepare:tessdata && npm run typecheck:tools && npm run test:distribution
      - name: Verify Offline OCR Assets & Tessdata
        run: npm run prepare:tessdata
      - name: Run Complete PR Battery (11 Critical Suites)
        run: npm run test:pr
  nightly-performance-stress:
    needs:
      - pr-quality-gates
    name: Performance, Load & Memory Stress (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck tools and regression gates
        run: npm run prepare:tessdata && npm run typecheck:tools && npm run test:distribution
      - name: Build Application Assets
        run: npm run build
      - name: Run Performance, Load & Recovery Suite
        run: npm run test:load
      - name: Run Reproducible Resource Benchmarks (CPU, RAM, Throughput)
        run: npm run benchmark
      - name: Build internal desktop (NÃO HOMOLOGADO)
        run: npm run package:internal
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Configurar sandbox SUID do Chromium no Linux (CI)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          CHROME_SANDBOX=$(find "${RELEASE_DIR}" -name "chrome-sandbox" -type f | head -n 1)
          if [ -n "$CHROME_SANDBOX" ] && [ -f "$CHROME_SANDBOX" ]; then
            echo "==> Configurando permissões de $CHROME_SANDBOX (root:root 4755)..."
            sudo chown root:root "$CHROME_SANDBOX"
            sudo chmod 4755 "$CHROME_SANDBOX"
            ls -la "$CHROME_SANDBOX"
          fi
      - name: Run Packaged Desktop Pre-Release Audit
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then xvfb-run -a npm run test:release; else npm run test:release; fi
        env:
          DISTRIBUTION_CHANNEL: internal
          ALLOW_UNSIGNED_INTERNAL: 'true'
      - name: Jornada documental no aplicativo empacotado
        shell: bash
        run: if [ "${{ runner.os }}" = "Linux" ]; then xvfb-run -a npm run test:journey; else npm run test:journey; fi
        env:
          DISTRIBUTION_CHANNEL: internal
          ALLOW_UNSIGNED_INTERNAL: 'true'
      - name: Jornada negativa no aplicativo empacotado
        shell: bash
        run: if [ "${{ runner.os }}" = "Linux" ]; then xvfb-run -a npm run test:journey:negative; else npm run test:journey:negative; fi
        env:
          DISTRIBUTION_CHANNEL: internal
          ALLOW_UNSIGNED_INTERNAL: 'true'
      - name: Validar instaladores e assinaturas
        run: npm run test:installers
        env:
          DISTRIBUTION_CHANNEL: internal
          ALLOW_UNSIGNED_INTERNAL: 'true'
      - name: Manifesto dos bytes finais
        run: npm run distribution:finalize
        env:
          DISTRIBUTION_CHANNEL: internal
          ALLOW_UNSIGNED_INTERNAL: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-NÃO-HOMOLOGADO-${{ matrix.os }}
          path: ${{ env.RELEASE_DIR }}/**
          retention-days: 7
    env:
      RELEASE_DIR: release/runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
